<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Communications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Subtle radial glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        /* Card */
        .pro-card {
            background: linear-gradient(180deg, #111827 0%, #0a0f1a 100%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 56px 48px;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .pro-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .pro-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 44px;
        }

        .pro-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 8px 16px;
            border-radius: 100px;
            margin-bottom: 24px;
            font-size: 12px;
            font-weight: 600;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pro-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #f9fafb;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7280;
            font-weight: 400;
        }

        /* Form */
        .form-group {
            margin-bottom: 26px;
            opacity: 0;
            animation: fadeSlide 0.5s ease forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #f3f4f6;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #4b5563;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        /* Drop zone */
        .drop-zone {
            border: 1.5px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(59, 130, 246, 0.04);
        }

        .drop-zone svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #3b82f6;
            stroke-width: 1.5;
            margin-bottom: 12px;
        }

        .drop-zone-text {
            font-size: 14px;
            color: #d1d5db;
            font-weight: 500;
        }

        .drop-zone-hint {
            font-size: 12px;
            color: #4b5563;
            margin-top: 6px;
        }

        input[type="file"] {
            display: none;
        }

        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .image-preview {
            width: 88px;
            height: 88px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Button */
        .generate-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: -0.2px;
        }

        .generate-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .generate-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(30px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner-ring {
            width: 60px;
            height: 60px;
            position: relative;
            margin-bottom: 28px;
        }

        .spinner-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-right-color: rgba(59, 130, 246, 0.3);
            animation: spin 1s linear infinite;
        }

        .spinner-ring::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #60a5fa;
            animation: spin 1.5s linear infinite reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: #f3f4f6;
            letter-spacing: -0.2px;
        }

        .loading-subtext {
            font-size: 14px;
            color: #6b7280;
            margin-top: 10px;
        }

        .loading-dots {
            display: flex;
            gap: 6px;
            margin-top: 20px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: dotPulse 1.4s ease infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Download */
        .download-section {
            display: none;
            text-align: center;
            padding: 28px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 20px;
            animation: fadeSlide 0.5s ease;
        }

        .download-section.active {
            display: block;
        }

        .success-ring {
            width: 60px;
            height: 60px;
            margin: 0 auto 18px;
            position: relative;
        }

        .success-ring svg {
            width: 100%;
            height: 100%;
        }

        .success-ring .circle-bg {
            fill: none;
            stroke: rgba(34, 197, 94, 0.2);
            stroke-width: 2;
        }

        .success-ring .circle-progress {
            fill: none;
            stroke: #22c55e;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 165;
            stroke-dashoffset: 165;
            animation: drawCircle 0.6s ease forwards;
        }

        .success-ring .check {
            fill: none;
            stroke: #22c55e;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: drawCheck 0.4s 0.4s ease forwards;
        }

        @keyframes drawCircle {
            to { stroke-dashoffset: 0; }
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .download-title {
            font-size: 20px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 6px;
        }

        .download-subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.3);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* Divider line */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            margin: 24px 0;
        }

        @media (max-width: 640px) {
            .pro-card {
                padding: 36px 24px;
            }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-ring"></div>
        <div class="loading-text">Processing your report</div>
        <div class="loading-subtext">Analyzing content with AI</div>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="container">
        <div class="pro-card">
            <div class="header">
                <div class="pro-badge">Rapid Comms Pro</div>
                <h1>Rapid Communications</h1>
                <p class="subtitle">Enterprise-grade document generation</p>
            </div>

            <form id="commsForm">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" placeholder="e.g., Google Health App Android Crash" required>
                </div>

                <div class="form-group">
                    <label for="projectInfo">Project Information</label>
                    <textarea id="projectInfo" placeholder="Describe the incident, launch, or situation. Include key details, timeline, affected users, and any known workarounds..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Attachments</label>
                    <div class="drop-zone" id="dropZone">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <div class="drop-zone-text">Drop images here or click to browse</div>
                        <div class="drop-zone-hint">PNG, JPG, JPEG up to 10MB each</div>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <div class="image-preview-container" id="imagePreviewContainer"></div>
                </div>

                <div class="divider"></div>

                <div class="form-group" style="animation-delay: 0.5s;">
                    <button type="submit" class="generate-btn">Generate Report</button>
                </div>
            </form>

            <div class="download-section" id="downloadSection">
                <div class="success-ring">
                    <svg viewBox="0 0 60 60">
                        <circle class="circle-bg" cx="30" cy="30" r="26"></circle>
                        <circle class="circle-progress" cx="30" cy="30" r="26"></circle>
                        <polyline class="check" points="20,31 27,38 40,23"></polyline>
                    </svg>
                </div>
                <div class="download-title">Report Generated</div>
                <div class="download-subtitle">Your communications document is ready for download</div>
                <a href="#" class="download-btn" id="downloadBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download
                </a>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const downloadSection = document.getElementById('downloadSection');
        const commsForm = document.getElementById('commsForm');

        let selectedFiles = [];

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    selectedFiles.push(file);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'image-preview';
                        imagePreviewContainer.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        commsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loadingOverlay.classList.add('active');
            downloadSection.classList.remove('active');

            await new Promise(resolve => setTimeout(resolve, 3500));

            loadingOverlay.classList.remove('active');
            downloadSection.classList.add('active');

            commsForm.reset();
            imagePreviewContainer.innerHTML = '';
            selectedFiles = [];
        });

        document.getElementById('downloadBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('In production, this will download your generated .docx report');
        });
    </script>
</body>
</html>
